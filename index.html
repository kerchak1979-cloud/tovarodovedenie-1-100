<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: Товароведение и экспертиза — экзамен</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f0f4f8;
    margin: 0; padding: 20px;
    color: #1f2d3d; line-height: 1.6;
  }
  .container { max-width: 980px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
    color: #fff; padding: 26px 30px;
    border-radius: 16px 16px 0 0;
  }
  header h1 { margin: 0 0 6px; font-size: 1.4em; }
  header p { margin: 0; opacity: 0.9; font-size: 0.92em; }

  .tabs {
    display: flex; background: #fff;
    border-bottom: 2px solid #e1e8f0;
    padding: 0 20px;
  }
  .tab {
    padding: 14px 24px; cursor: pointer;
    font-weight: 600; font-size: 0.95em;
    color: #5d6d7e; border-bottom: 3px solid transparent;
    transition: 0.2s;
  }
  .tab:hover { color: #2980b9; }
  .tab.active {
    color: #1a5276; border-bottom-color: #2980b9;
  }

  .main {
    background: #fff; border-radius: 0 0 16px 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    padding: 24px 30px 34px;
  }

  .stats-bar {
    display: flex; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: #f8f9fa;
    border-radius: 10px; margin-bottom: 20px;
    font-size: 0.9em; color: #5d6d7e;
  }
  .stats-bar b { color: #1a5276; }

  .question-card {
    border: 2px solid #e1e8f0; border-radius: 12px;
    padding: 18px 22px; margin-bottom: 14px;
    background: #fff; transition: 0.3s;
  }
  .question-card.correct { border-color: #27ae60; background: #eafaf1; }
  .question-card.wrong { border-color: #c0392b; background: #fdedec; }

  .q-num {
    display: inline-block; background: #2980b9; color: #fff;
    padding: 2px 10px; border-radius: 12px;
    font-size: 0.78em; font-weight: 700; margin-bottom: 8px;
  }
  .q-text { font-weight: 600; margin-bottom: 14px; font-size: 0.96em; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border: 2px solid #e9ecef;
    border-radius: 8px; cursor: pointer;
    transition: 0.2s; font-size: 0.92em; background: #fff;
    user-select: none;
  }
  .option:hover { border-color: #2980b9; background: #f4f9fd; }
  .option input {
    margin-top: 4px; transform: scale(1.15);
    accent-color: #2980b9; flex-shrink: 0; cursor: pointer;
  }
  .option.correct-answer { border-color: #27ae60; background: #eafaf1; }
  .option.wrong-answer { border-color: #c0392b; background: #fdedec; }
  .option.disabled { pointer-events: none; opacity: 0.92; }

  .feedback {
    margin-top: 12px; font-size: 0.9em;
    padding: 12px 16px; border-radius: 8px;
    line-height: 1.55;
  }
  .feedback.ok { background: #d5f5e3; color: #1e8449; }
  .feedback.no { background: #fadbd8; color: #922b21; }
  .feedback b { color: #1a2332; }

  .btn-check {
    margin-top: 12px; padding: 10px 24px;
    background: #2980b9; color: #fff;
    border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.92em;
    font-weight: 600; cursor: pointer;
    transition: 0.2s;
  }
  .btn-check:hover { background: #1a5276; }
  .btn-check:disabled { background: #bdc3c7; cursor: not-allowed; }

  .btn-row {
    display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap;
  }
  button.btn-reset {
    font-family: inherit; font-size: 1em;
    padding: 12px 28px; border-radius: 8px;
    border: none; cursor: pointer; font-weight: 600;
    background: #ecf0f1; color: #2c3e50;
    transition: 0.2s;
  }
  button.btn-reset:hover { background: #d5dbdb; }

  .final-summary {
    margin-top: 20px; padding: 18px 22px;
    border-radius: 10px; display: none;
    font-size: 1em;
  }
  .final-summary.show { display: block; }
  .final-summary.good { background: #eafaf1; border: 2px solid #27ae60; }
  .final-summary.bad { background: #fdedec; border: 2px solid #c0392b; }

  @media (max-width: 640px) {
    body { padding: 10px; }
    .main { padding: 18px 16px 26px; }
    .tab { padding: 12px 14px; font-size: 0.88em; }
  }
</style>
</head>

    <button class="btn-reset" onclick="resetAll()">🔄 Начать заново</button>

  <div class="final-summary" id="finalSummary"></div>
</div>

let stats = { answered: 0, correct: 0, wrong: 0 };

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('singleBlock').style.display = tab === 'single' ? 'block' : 'none';
  document.getElementById('multiBlock').style.display = tab === 'multi' ? 'block' : 'none';
}

function renderSingle() {
  const container = document.getElementById('singleBlock');
  container.innerHTML = '';
  SINGLE.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'sq-' + i;
    const letters = ['А', 'Б', 'В', 'Г', 'Д'];
    card.innerHTML = `
      <span class="q-num">Вопрос ${i + 1}</span>
      <div class="q-text">${q.q}</div>
      <div class="options" id="sopts-${i}">
        ${q.opts.map((opt, j) => `
          <div class="option" id="so-${i}-${j}" onclick="checkSingle(${i}, ${j})">
            <input type="radio" name="sq${i}" readonly>
            <span><b>${letters[j]})</b> ${opt}</span>
          </div>
        `).join('')}
      </div>
      <div class="feedback" id="sfb-${i}" style="display:none;"></div>
    `;
    container.appendChild(card);
  });
}

function checkSingle(qIndex, selected) {
  const q = SINGLE[qIndex];
  const card = document.getElementById('sq-' + qIndex);
  if (card.dataset.done === '1') return;

  const feedback = document.getElementById('sfb-' + qIndex);
  const options = document.querySelectorAll(`#sopts-${qIndex} .option`);
  options.forEach(o => o.classList.add('disabled'));

  const correctOpt = document.getElementById(`so-${qIndex}-${q.correct}`);
  correctOpt.classList.add('correct-answer');

  card.dataset.done = '1';
  stats.answered++;

  if (selected === q.correct) {
    card.classList.add('correct');
    feedback.className = 'feedback ok';
    feedback.innerHTML = `<b>✅ Верно!</b><br>${q.explain}`;
    stats.correct++;
  } else {
    card.classList.add('wrong');
    document.getElementById(`so-${qIndex}-${selected}`).classList.add('wrong-answer');
    feedback.className = 'feedback no';
    feedback.innerHTML = `<b>❌ Неверно.</b> Правильный ответ выделен зелёным.<br><b>Пояснение:</b> ${q.explain}`;
    stats.wrong++;
  }
  feedback.style.display = 'block';
  updateStats();
}

function renderMulti() {
  const container = document.getElementById('multiBlock');
  container.innerHTML = '';
  MULTI.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'mq-' + i;
    const letters = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];
    card.innerHTML = `
      <span class="q-num">Вопрос ${i + 71}</span>
      <div class="q-text">${q.q}</div>
      <div class="options" id="mopts-${i}">
        ${q.opts.map((opt, j) => `
          <label class="option" id="mo-${i}-${j}">
            <input type="checkbox" value="${j}" id="mch-${i}-${j}">
            <span><b>${letters[j]})</b> ${opt}</span>
          </label>
        `).join('')}
      </div>
      <button class="btn-check" id="mbtn-${i}" onclick="checkMulti(${i})">Проверить</button>
      <div class="feedback" id="mfb-${i}" style="display:none;"></div>
    `;
    container.appendChild(card);
  });
}

function checkMulti(qIndex) {
  const q = MULTI[qIndex];
  const card = document.getElementById('mq-' + qIndex);
  if (card.dataset.done === '1') return;

  const selected = [];
  q.opts.forEach((_, j) => {
    if (document.getElementById(`mch-${qIndex}-${j}`).checked) selected.push(j);
  });
  if (selected.length === 0) {
    alert('Выберите хотя бы один вариант');
    return;
  }

  const correctSet = new Set(q.correct);
  const selectedSet = new Set(selected);
  q.opts.forEach((_, j) => {
    const optEl = document.getElementById(`mo-${qIndex}-${j}`);
    optEl.classList.add('disabled');
    if (correctSet.has(j)) optEl.classList.add('correct-answer');
    if (selectedSet.has(j) && !correctSet.has(j)) optEl.classList.add('wrong-answer');
  });
  document.getElementById(`mbtn-${qIndex}`).disabled = true;

  const isCorrect = selected.length === q.correct.length &&
                    selected.every(s => correctSet.has(s));
  card.dataset.done = '1';
  stats.answered++;

  const feedback = document.getElementById('mfb-' + qIndex);
  if (isCorrect) {
    card.classList.add('correct');
    feedback.className = 'feedback ok';
    feedback.innerHTML = `<b>✅ Верно!</b><br>${q.explain}`;
    stats.correct++;
  } else {
    card.classList.add('wrong');
    feedback.className = 'feedback no';
    const correctLetters = q.correct.map(c => ['А','Б','В','Г','Д','Е'][c]).join(', ');
    feedback.innerHTML = `<b>❌ Неверно.</b> Правильные ответы: <b>${correctLetters}</b>.<br><b>Пояснение:</b> ${q.explain}`;
    stats.wrong++;
  }
  feedback.style.display = 'block';
  updateStats();
}

function updateStats() {
  document.getElementById('answered').textContent = stats.answered;
  document.getElementById('correct').textContent = stats.correct;
  document.getElementById('wrong').textContent = stats.wrong;

  const total = SINGLE.length + MULTI.length;
  if (stats.answered === total) {
    const summary = document.getElementById('finalSummary');
    const percent = Math.round((stats.correct / total) * 100);
    summary.classList.add('show');
    if (percent >= 80) {
      summary.className = 'final-summary show good';
      summary.innerHTML = `<h3>🎉 Отличный результат!</h3><p>Правильных ответов: <b>${stats.correct}</b> из <b>${total}</b> (<b>${percent}%</b>).</p>`;
    } else if (percent >= 60) {
      summary.className = 'final-summary show good';
      summary.innerHTML = `<h3>👍 Хороший результат</h3><p>Правильных ответов: <b>${stats.correct}</b> из <b>${total}</b> (<b>${percent}%</b>). Стоит повторить отдельные темы.</p>`;
    } else {
      summary.className = 'final-summary show bad';
      summary.innerHTML = `<h3>📚 Нужно повторить материал</h3><p>Правильных ответов: <b>${stats.correct}</b> из <b>${total}</b> (<b>${percent}%</b>). Рекомендуется вернуться к лекциям.</p>`;
    }
  }
}

function resetAll() {
  stats = { answered: 0, correct: 0, wrong: 0 };
  document.getElementById('finalSummary').classList.remove('show');
  renderSingle();
  renderMulti();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderSingle();
renderMulti();
updateStats();
</script>
</body>
</html>
